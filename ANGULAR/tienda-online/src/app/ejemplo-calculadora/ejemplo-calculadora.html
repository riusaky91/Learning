<h2 class="text-center text-warning">Calculadora</h2>
<div class="d-flex justify-content-center">
    <div class="w-50">
        <div class="mb-3">
            <label for="inputTexto" class="mx-2">Operando A: </label>
            <input id="inputTexto" type="number" [(ngModel)]="operandoa" autocomplete="off" />
        </div>
        <div class="mb-3">
            <label for="inputTexto" class="mx-2">Operando B: </label>
            <input id="inputTexto" type="number" [(ngModel)]="operandob" autocomplete="off" />
        </div>
        <div class="mb-3">
            <button class="btn btn-primary" (click)="sumar()">Sumar</button>
        </div>
        <div class="mb-3">
            <div class="alert alert-success mt-4 mx-auto w-50">
                Resultado: {{ resultado }}
            </div>
        </div>
    </div>
</div>
