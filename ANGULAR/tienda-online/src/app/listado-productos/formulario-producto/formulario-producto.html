<h5 class="text-succes mt-3 text-center mt-4">Agregar Nuevo Producto</h5> <!-- Título centrado para el formulario de guardar producto -->

<form class="my-4 w-50 mx-auto" #f="ngForm" (ngSubmit)="f.form.valid && guardarProducto()"> <!-- Formulario con clases de Bootstrap para centrar y espaciar los elementos -->
    <div class="d-flex justify-content-between align-items-center">
        <input type="text" id="descripcion" name="descripcion" placeholder="Descripción Producto"
            class="form-control me-2 w-75" autocomplete="off" [(ngModel)]="producto.descripcion" required/> <!-- Campo de texto para la descripción del producto enlazado al modelo -->
        <input type="number" id="precio" name="precio" placeholder="Precio" class="form-control me-2 w-25"
            [(ngModel)]="producto.precio" required /> <!-- Campo de número para el precio del producto enlazado al modelo -->
    </div>

    <div class="d-flex justify-content-center mt-3">
    
        <button type="submit" class="btn btn-primary">Guardar Producto</button><!-- Botón de submit con clase de Bootstrap para agregar el producto, solo se habilita si el formulario es válido -->
        @if(llaveProducto !== null) { <!-- Si el productoID no es null, significa que se está editando un producto existente, por lo que se muestra el botón de cancelar -->
            <button type="button" class="btn btn-danger mx-3" (click)="eliminarProducto()">Eliminar Producto</button> <!-- Botón de tipo button con clase de Bootstrap para eliminar el producto, con evento click que llama al método eliminarProducto() -->
        }
        <button type="button" class="btn btn-danger" (click)="cancelar()">Cancelar</button> <!-- Botón de tipo button con clase de Bootstrap para cancelar la acción, con evento click que llama al método cancelar() -->
    </div>
    
</form>
