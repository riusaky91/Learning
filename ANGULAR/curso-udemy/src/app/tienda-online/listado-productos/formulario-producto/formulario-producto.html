<h5 class="text-succes mt-3 text-center">Agregar nuevo producto</h5>

<form class="d-flex justify-content-between alingn-items-center my-4 w-50 mx-auto" (submit)="guardarProducto($event)"
    #f="ngForm" (submit)="f.form.valid && guardarProducto($event)">
    <input type="text" id="descripcion" name="descripcion" placeholder="descripcion producto"
        class="form-control me-2 w-75" autocomplete="off" [(ngModel)]="descripcionInput" required>
    <input type="number" id="precio" name="precio" placeholder="precio" class="form-control me-2 w-25"
        [(ngModel)]="precioInput" required>

    <button type="submit" class="btn btn-primary" [disabled]="f.form.invalid">Guardar Producto</button>
</form>
