<h2 class="text-center text-warning">Listado de Productos</h2> <!-- Título centrado y en color amarillo -->

<app-producto /> <!-- Componente de producto -->
<app-producto /> <!-- Componente de producto -->
<app-producto /> <!-- Componente de producto -->

<div class="container mg-5">
    <h2 class="text-center">Listado de productos</h2>
    <ul class="list-group w-50 mx-auto">
        @for (producto of productos; track producto) { <!-- Itera sobre la lista de productos -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{producto.descripcion}}, ${{producto.precio}} <!-- Muestra el nombre del producto -->   
            </li>   
        }
    </ul>   

    <div class="mt-3 d-flex justify-content-center">
        <input [(ngModel)]="productoInput" type="text" class="form-control mb-2 w-50"
            placeholder="Nuevo producto" autocomplete="off"><!-- Input con referencia local -->
        <input [(ngModel)]="precioInput" type="number" class="form-control mb-2 w-25 ms-2"
            placeholder="Precio"><!-- Input para el precio del producto -->
        <button (click)="agregarProducto();" class="btn btn-primary">Agregar</button> <!-- Botón que llama al método agregarProducto usando la referencia local -->
    </div>
</div>
