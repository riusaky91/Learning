
<div class="row justify-content-center mt-4">
      <div class="col-md-8">
        <form class="row g-2">
          <div class="col-auto">
            <select (change)="tipoOperacion($event)" class="form-select bg-success"
              [ngClass]="{'bg-danger': tipo === 'egresoOperacion', 'bg-success': tipo === 'ingresoOperacion'}" > <!-- Select para elegir el tipo de operación con clases dinámicas -->
              <option value="ingresoOperacion" selected="">+</option>
              <option value="egresoOperacion">-</option>
            </select>
          </div>
          <div class="col">
            <input type="text" class="form-control border-success" placeholder="Descripción" required="" [(ngModel)]="descripcionInput" name="descripcion"
            [ngClass]="{'bg-danger': tipo === 'egresoOperacion', 'bg-success': tipo === 'ingresoOperacion'}"> <!-- Input para la descripción del presupuesto con two-way data binding -->
          </div>
          <div class="col-auto">
            <input type="number" class="form-control border-success" placeholder="Valor" required="" [(ngModel)]="precioInput" name="precio"
            [ngClass]="{'bg-danger': tipo === 'egresoOperacion', 'bg-success': tipo === 'ingresoOperacion'}"><!-- Input para el valor del presupuesto con two-way data binding -->
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-success"
            [ngClass]="{'bg-danger': tipo === 'egresoOperacion', 'bg-success': tipo === 'ingresoOperacion'}" >
              <i class="bi bi-check-circle" (click)="aumentarPresupuesto()">agregar</i> <!-- Bootstrap Icon -->
            </button>
          </div>
        </form>
      </div>
    </div>
