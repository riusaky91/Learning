<div class="col-md-6">
        <h2 class="text-center text-primary">Ingresos</h2>
        <ul class="list-group mt-3">
            @for (presupuesto of presupuestos; track $index) {
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span class="flex-grow-1">{{presupuesto.descripcion}}</span>
              <span class="text-success mx-3">${{presupuesto.precio | number:'1.2-2'}}</span>
              <button class="btn btn-sm btn-danger">
                <i class="bi bi-x-circle"></i> <!-- Bootstrap Icon -->
              </button>
            </li>
            }
        </ul>
      </div>
