<div class="container mt-5">
    <h2>Agregar tarea</h2>
    <div class="mt-3 d-flex justify-content-center">
        <input #tareaInput type="text" class="form-control mb-2 w-50"
            placeholder="Nueva tarea"><!-- Input con referencia local -->


        <button (click)="agregarTarea(tareaInput.value)" class="btn btn-primary">Agregar</button> <!-- Botón que llama al método agregarTarea usando la referencia local -->
    </div>
    <div class="mt-3">
        <h4>Tarea agregada:</h4>
        @if (tarea) {

            <p>{{ tarea }}</p> <!-- Muestra la tarea agregada -->   
        }
        
    </div>
</div>
