<div class="container mt-5 text-center">
    <h2>Estatus de Autenticación</h2>

    @if(isAuthenticated) { <!-- Directiva *ngIf para mostrar contenido basado en la autenticación -->
        <p class="text-success">¡Usuario autenticado!</p>
    }@else {
        <p class="text-danger">Usuario no autenticado. Por favor, inicie sesión.</p>
    }

    <button class="btn btn-primary mt-3" (click)="toggleAuthentication()">
        {{ isAuthenticated ? 'Cerrar Sesión' : 'Iniciar Sesión' }} <!-- Cambia el texto del botón según el estado operador ternario -->
    </button>
</div>
