<section>
    <div class="container mt-4"> <!-- Agregado clase container y margen superior -->
        <h2 class="text-center text-info">{{titulo}}</h2> <!-- Agregado clases de Bootstrap para centrar y colorear el título -->
        <ul class="list-group mt-3">
            <li class="list-group-item">Nombre: {{usuario.nombre}}</li> <!-- Agregado clases de Bootstrap para lista -->
            <li class="list-group-item">Apellido: {{usuario.apellido}}</li>
            <li class="list-group-item">Edad: {{usuario.edad}}</li>
            <li class="list-group-item">Saludo: {{saludar()}}</li>
            <li class="list-group-item">
                <p>en un año tendrás {{usuario.edad + 1}} años.</p>
            </li>

        </ul>

    </div>
</section>
